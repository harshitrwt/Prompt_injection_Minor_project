name: Qdrant Cloud Keep-Alive Cronjob

on:
  schedule:
    # Runs at 00:00 UTC every 2 days
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  keepalive:
    name: Ping Qdrant Cloud Cluster
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Keep-Alive Ping
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL || 'https://20114ca1-54ce-48e3-a49f-2ff3c7c7d190.eu-west-2-0.aws.cloud.qdrant.io' }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIiwic3ViamVjdCI6ImFwaS1rZXk6OGNiMWY3ZmItY2MwNi00NzYxLTlkNWEtZTdkODg2NDVjODBjIn0.BPk-rNOn8psAZ-dxnEohEfNkDBY9B8rn_FC5hG9qw9o' }}
          QDRANT_COLLECTION_NAME: 'prompt_injections'
        run: |
          python scripts/qdrant_keepalive.py
